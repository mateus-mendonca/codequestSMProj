<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${etapa.titulo} + ' — CodeQuest'">CodeQuest — Fase</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:replace="~{fragments/layout :: navBreadcrumb(active='modulos')}"></header>

<div class="etapa-container">
    <a th:href="@{'/modulos/' + ${modulo.id}}" class="nav-link-muted" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:1.5rem;">
        &larr; Voltar para o Mapa do Mundo
    </a>

    <div class="etapa-header">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 0.8rem; flex-wrap: wrap;">
            <span class="badge"><img th:src="@{/img/sprites/icon-target.png}" alt="" class="sprite-icon"><span th:text="'Fase ' + ${etapa.numero} + ' de ' + ${totalEtapas}">Fase 1 de 5</span></span>
            <span class="badge badge-info"><img th:src="@{/img/sprites/icon-world.png}" alt="" class="sprite-icon"><span th:text="${modulo.titulo}">Mundo 01</span></span>
        </div>

        <h1 class="auth-title" style="margin-bottom: 1rem; text-align: left;" th:text="${etapa.titulo}">O que é Lógica de Programação?</h1>
    </div>

    <!-- Card de Missão da Fase -->
    <div class="objective-card" th:if="${etapa.objetivo != null}">
        <div class="objective-title"><img th:src="@{/img/sprites/icon-target.png}" alt="" class="sprite-icon"> Missão da Fase</div>
        <div class="objective-content" th:text="${etapa.objetivo}">Missão...</div>
    </div>

    <!-- Texto de Explicação -->
    <div class="explanation-text" th:text="${etapa.explicacao}">
        Explicação teórica da fase...
    </div>

    <!-- Caixa de Exemplo / Código Estilo Terminal Claro/Moderno -->
    <div class="code-box" th:if="${etapa.exemplo != null}">
        <div class="code-header">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span style="margin-left: 0.5rem; font-weight:700;">exemplo_algoritmo.cq</span>
        </div>
        <div class="code-body" th:utext="${etapa.exemplo}">
            1. Passo 1
            2. Passo 2
        </div>
    </div>

    <!-- Navegação entre Fases -->
    <div class="nav-buttons">
        <div>
            <a th:if="${etapaAnterior != null}"
               th:href="@{'/modulos/' + ${modulo.id} + '/etapas/' + ${etapaAnterior}}"
               class="btn btn-secondary">
                &larr; Fase Anterior
            </a>
        </div>

        <a th:href="@{'/modulos/' + ${modulo.id}}" class="nav-link-muted">
            <img th:src="@{/img/sprites/icon-map.png}" alt="" class="sprite-icon"> Mapa do Mundo
        </a>

        <div>
            <a th:if="${proximaEtapa != null}"
               th:href="@{'/modulos/' + ${modulo.id} + '/etapas/' + ${proximaEtapa}}"
               class="btn btn-primary">
                Próxima Fase &rarr;
            </a>
            <a th:unless="${proximaEtapa != null}"
               th:href="@{'/modulos/' + ${modulo.id} + '/quiz'}"
               class="btn btn-primary" style="background: linear-gradient(135deg, var(--primary), #1db37a);">
                <img th:src="@{/img/sprites/icon-trophy.png}" alt="" class="sprite-icon"> Desafio Final &rarr;
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
