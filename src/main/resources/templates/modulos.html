<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest — Escolha um Mundo</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <header th:replace="~{fragments/layout :: navBreadcrumb(active='modulos')}"></header>

    <div class="modulos-wrapper">
        <div class="modulos-header">
            <div>
                <div class="section-label">
                    <img th:src="@{/img/sprites/icon-world.png}" alt="Mundos" class="sprite-icon"
                        style="margin-right: 4px;">
                    MAPA DE AVENTURAS
                </div>
                <h1 class="auth-title" style="margin-bottom:0; text-align: left;">Escolha o seu Mundo</h1>
                <p class="hero-text" style="margin: 6px 0 0; font-size: 15px;">Selecione um território de aprendizagem
                    para iniciar sua trilha de desafios.</p>
            </div>
            <img th:src="@{/img/Correndo.png}" alt="Mascote correndo"
                style="width: 100px; filter: drop-shadow(0 6px 12px rgba(36,201,139,0.2));" class="hide-mobile">
        </div>

        <div class="modulos-trail">
            <a th:each="modulo : ${modulos}" th:href="${modulo.disponivel} ? @{'/modulos/' + ${modulo.id}} : '#'"
                class="module-card" th:classappend="${!modulo.disponivel} ? 'locked'"
                style="text-decoration: none; color: inherit;">

                <div class="module-card-left">
                <div class="module-icon-bubble">
                    <img th:if="${modulo.disponivel}" th:src="@{/img/sprites/icon-laptop.png}" alt="Módulo disponível">
                    <img th:unless="${modulo.disponivel}" th:src="@{/img/sprites/icon-lock.png}" alt="Módulo bloqueado">
                    </div>

                    <div class="module-card-info">
                        <div class="module-number" th:text="'Mundo ' + ${#numbers.formatInteger(modulo.numero, 2)}">
                            Mundo 01</div>
                        <h2 class="module-title" th:text="${modulo.titulo}">Título do Mundo</h2>
                        <p class="module-desc" th:text="${modulo.descricao}">Descrição temática das habilidades
                            ensinadas neste módulo.</p>

                        <div class="module-meta" th:if="${modulo.disponivel}">
                            <span><img th:src="@{/img/sprites/icon-target.png}" alt="" class="sprite-icon"> <strong th:text="${modulo.topicos} + ' fases'">5 fases</strong></span>
                            <span style="color: var(--primary-dark); font-weight: 800;">Entrar na Trilha &rarr;</span>
                        </div>
                    </div>
                </div>

                <div>
                    <span th:if="${modulo.disponivel}" class="module-available-badge"><img th:src="@{/img/sprites/icon-rocket.png}" alt="" class="sprite-icon-sm"> Desbloqueado</span>
                    <span th:unless="${modulo.disponivel}" class="module-lock-badge"><img th:src="@{/img/sprites/icon-lock.png}" alt="" class="sprite-icon-sm"> Em Breve</span>
                </div>
            </a>

            <p th:if="${#lists.isEmpty(modulos)}" class="empty-state">
                Nenhum mundo disponível no momento.
            </p>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
