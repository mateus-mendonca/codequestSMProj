<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>fragments</title>
</head>

<body class="page-layout">

    <!-- Navbar simples usada na home: logo gamificado com mascote + botão de acesso -->
    <header th:fragment="navHome" class="navbar">
        <button type="button" class="btn btn-secondary cq-theme">Alternar tema</button>
        <button type="button" class="btn btn-secondary cq-help">Tutorial</button>
        <a href="/" class="logo">
            <img th:src="@{/img/favicon.png}" alt="CodeQuest" class="logo-img">
            <span>Code<b>Quest</b></span>
        </a>
        <a href="/modulos" class="nav-link-muted">Explorar sem conta &rarr;</a>
    </header>

    <!-- Navbar com breadcrumb, usada nas páginas internas (login, módulos, etapas, etc) -->
    <header th:fragment="navBreadcrumb(active)" class="navbar">
        <button type="button" class="btn btn-secondary cq-theme">Alternar tema</button>
        <button type="button" class="btn btn-secondary cq-help">Tutorial</button>
        <div class="navbar-brand-row">
            <a href="/" class="logo">
                <img th:src="@{/img/favicon.png}" alt="CodeQuest" class="logo-img">
                <span>Code<b>Quest</b></span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Abrir navegação"
                >
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="navbar-center-area">
            <nav class="breadcrumb">
                <a href="/login" th:classappend="${active == 'auth'} ? 'crumb-active'">Auth</a>
                <span class="crumb-sep">&gt;</span>
                <a href="/modulos" th:classappend="${active == 'modulos'} ? 'crumb-active'">Mundos</a>
                <span class="crumb-sep">&gt;</span>
                <span th:classappend="${active == 'conteudo'} ? 'crumb-active'">Conteúdo</span>
                <span class="crumb-sep">&gt;</span>
                <span th:classappend="${active == 'quiz'} ? 'crumb-active'">Quiz</span>
            </nav>
        </div>

        <!-- HUD do Jogador (XP, Fases Concluídas, Mundos) com sprites do jogo -->
        <div class="player-hud" th:if="${resumoJogador != null}">
            <div class="hud-item" title="XP Acumulado">
                <img th:src="@{/img/sprites/icon-xp.png}" alt="XP" class="sprite-icon">
                <span class="hud-label">XP</span>
                <span class="hud-value" th:text="${resumoJogador.xpTotal}">0</span>
            </div>
            <div class="hud-separator">|</div>
            <div class="hud-item" title="Fases Concluídas">
                <img th:src="@{/img/sprites/icon-target.png}" alt="Fases" class="sprite-icon">
                <span class="hud-label">FASES</span>
                <span class="hud-value" th:text="${resumoJogador.fasesConcluidas}">0</span>
            </div>
            <div class="hud-separator">|</div>
            <div class="hud-item" title="Mundos Conquistados">
                <img th:src="@{/img/sprites/icon-world.png}" alt="Mundos" class="sprite-icon">
                <span class="hud-label">MUNDOS</span>
                <span class="hud-value" th:text="${resumoJogador.mundosConquistados}">0</span>
            </div>
        </div>
    </header>

    <footer th:fragment="footer" class="footer">
        <div class="footer-brand-row">
            <span class="footer-brand-name"><img th:src="@{/img/sprites/icon-rocket.png}" alt="" class="sprite-icon"> CodeQuest</span>
            <span>&copy; 2026</span>
        </div>
        <span class="footer-muted">Plataforma Educacional Gamificada de Programação</span>
        <script type="module" th:src="@{/js/main.js}"></script>
    </footer>

</body>

</html>
