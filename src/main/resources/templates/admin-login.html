<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest — Acesso administrativo</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navHome}"></header>

<main class="auth-wrapper">
    <img th:src="@{/img/Sentado.png}" alt="Mascote CodeQuest" class="auth-mascot">
    <div class="section-label" style="text-align:center; margin-bottom:6px;">
        <img th:src="@{/img/sprites/icon-lock.png}" alt="" class="sprite-icon"> ÁREA RESTRITA
    </div>
    <h1 class="auth-title">Acesso administrativo</h1>

    <form class="auth-card" method="post" th:action="@{/admin/login}">
        <div th:if="${erro != null}" class="alert-error" role="alert" th:text="${erro}">E-mail ou senha inválidos.</div>
        <div class="field">
            <label for="email"><img th:src="@{/img/sprites/icon-laptop.png}" alt="" class="sprite-icon-sm"> E-mail</label>
            <div class="input-wrap">
                <input type="email" id="email" name="email" th:value="${email}" autocomplete="username" required autofocus>
            </div>
        </div>
        <div class="field">
            <label for="senha"><img th:src="@{/img/sprites/icon-lock.png}" alt="" class="sprite-icon-sm"> Senha</label>
            <div class="input-wrap">
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
            <img th:src="@{/img/sprites/icon-rocket.png}" alt="" class="sprite-icon"> Entrar no painel
        </button>
    </form>
    <div class="auth-links"><a href="/" class="continue">&larr; Voltar ao site</a></div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
